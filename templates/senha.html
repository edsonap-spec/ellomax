{% extends "base.html" %}
{% block title %}Minha senha{% endblock %}
{% block content %}
<div class="card xnarrow"><div class="card-head"><h2><i class="bi bi-key"></i> Alterar minha senha</h2></div><div class="card-body">
 <form method="post" class="form-grid">
  <input type="hidden" name="_csrf" value="{{ csrf_token }}">
  <div class="field"><label for="atual">Senha atual</label><input id="atual" type="password" name="atual" required autocomplete="current-password"></div>
  <div class="field"><label for="nova">Nova senha</label><input id="nova" type="password" name="nova" required minlength="8" autocomplete="new-password"><div class="hint">Mínimo de 8 caracteres.</div></div>
  <div class="field"><label for="confirma">Confirmar nova senha</label><input id="confirma" type="password" name="confirma" required autocomplete="new-password"></div>
  <div><button class="btn btn-primary"><i class="bi bi-check-lg"></i> Salvar</button></div>
 </form>
</div></div>
{% endblock %}
