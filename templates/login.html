{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
 <div class="col-sm-8 col-md-5 col-lg-4">
  <div class="card p-4">
   <h4 class="mb-1"><i class="bi bi-briefcase text-primary"></i> Controle de Licitações</h4>
   <p class="text-muted small mb-4">Entre com seu usuário</p>
   <form method="post">
    <input type="hidden" name="_csrf" value="{{ csrf_token }}">
    <div class="mb-3"><label class="form-label">E-mail</label><input name="email" type="text" class="form-control" required autofocus></div>
    <div class="mb-3"><label class="form-label">Senha</label><input name="senha" type="password" class="form-control" required></div>
    <button class="btn btn-primary w-100">Entrar</button>
   </form>
  </div>
 </div>
</div>
{% endblock %}
