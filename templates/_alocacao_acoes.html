{% set volta = request.path ~ ('#ativos' if request.endpoint == 'edital_ver' else '') %}
<span class="btns">
{% if not x.data_retorno %}<button type="button" class="btn btn-sm btn-icon btn-ghost t-ok" data-toggle="dev{{ x.id }}" title="Devolver ao estoque" aria-label="Devolver ao estoque"><i class="bi bi-box-arrow-in-left"></i></button>{% endif %}
<a class="btn btn-sm btn-icon btn-ghost" href="{{ url_for('alocacao_editar', aid=x.id, voltar=volta) }}" title="Editar" aria-label="Editar"><i class="bi bi-pencil"></i></a>
<form method="post" action="{{ url_for('alocacao_excluir', aid=x.id) }}" class="inline" data-confirm="Excluir esta alocação? (para registrar o retorno use Devolver)"><input type="hidden" name="_csrf" value="{{ csrf_token }}"><input type="hidden" name="voltar" value="{{ volta }}"><button class="btn btn-sm btn-icon btn-ghost t-danger" title="Excluir" aria-label="Excluir"><i class="bi bi-trash3"></i></button></form>
</span>
{% if not x.data_retorno %}
<div class="hidden" id="dev{{ x.id }}" style="margin-top:8px">
 <form method="post" action="{{ url_for('alocacao_devolver', aid=x.id) }}" style="display:flex;gap:4px;justify-content:flex-end">
  <input type="hidden" name="_csrf" value="{{ csrf_token }}"><input type="hidden" name="voltar" value="{{ volta }}">
  <input type="text" name="quantidade" class="sm num-in" style="width:70px" value="{{ x.quantidade|num }}" title="Quantidade devolvida">
  <input type="date" name="data_retorno" class="sm" style="width:140px" value="{{ hoje }}">
  <button class="btn btn-sm btn-primary">Devolver</button>
 </form>
</div>
{% endif %}
